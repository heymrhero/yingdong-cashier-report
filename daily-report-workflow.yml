name: 盈动收银系统可视化报表

on:
  # 由 cron-job.org 每天北京时间 21:00 触发 workflow_dispatch
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: 运行报表生成脚本
        env:
          POS_USERNAME: ${{ secrets.POS_USERNAME }}
          POS_PASSWORD: ${{ secrets.POS_PASSWORD }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: node generate_report.js --output cashier_report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cashier-report
          path: cashier_report.html
          retention-days: 30
